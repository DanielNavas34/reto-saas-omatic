<div>
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
    <label style="font-weight: bold;">Volumen Estimado (Usos):</label>
    <span style="background-color: #0056b3; color: white; padding: 2px 8px; border-radius: 12px; font-weight: bold; font-size: 14px;">
      {{ users }} usuarios
    </span>
  </div>

  <input
    type="range"
    [value]="users"
    (input)="onUsersInput(rangeValue($event))"
    min="0"
    max="150"
    step="1"
    style="width: 100%; cursor: pointer; accent-color: #0056b3;">
</div>

<div style="margin-top: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
  <div>
    <label style="font-weight: bold;">Almacenamiento (GB)</label>
    <input
      type="number"
      min="0"
      [value]="storageGb"
      (input)="onStorageInput(rangeValue($event))"
      style="width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
  </div>
  <div>
    <label style="font-weight: bold;">Llamadas API</label>
    <input
      type="number"
      min="0"
      [value]="apiCalls"
      (input)="onApiCallsInput(rangeValue($event))"
      style="width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
  </div>
</div>

<div style="margin-top: 15px;">
  <label style="font-weight: bold;">Moneda de Facturación:</label>

  <select
    [value]="currencyCode"
    (change)="onCurrencyChange(rangeValue($event))"
    style="width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px;">
    <option value="EUR">Euros (€) - Base</option>
    <option value="USD">Dólares ($)</option>
    <option value="GBP">Libras (£)</option>
  </select>
  <p *ngIf="rateLabel" style="margin: 6px 0 0; font-size: 13px; color: #555;">{{ rateLabel }}</p>
</div>

<div style="margin-top: 20px; text-align: center; background-color: #e9ecef; padding: 15px; border-radius: 4px;">
  <h3 style="margin: 0; color: #0056b3; font-size: 16px;">Proyección en Tiempo Real</h3>
  <p style="font-size: 26px; font-weight: bold; margin: 10px 0 0 0; color: #333;">
    <ng-container *ngIf="amount !== null; else pendingAmount">{{ amount | number:'1.2-2' }} {{ amountCurrency }}</ng-container>
    <ng-template #pendingAmount>{{ calculating ? 'Calculando…' : '—' }}</ng-template>
  </p>
  <p style="margin: 8px 0 0; font-size: 12px; color: #666;">Calculado en el servidor. El plan no cambia el precio.</p>
  <p *ngIf="quoteError" style="margin: 8px 0 0; color: #9b1c1c; font-size: 14px;">{{ quoteError }}</p>
</div>

<button
  (click)="guardarSimulacion()"
  [disabled]="saving || !customer"
  [style.background-color]="savedFlash ? '#20c997' : '#28a745'"
  [style.opacity]="!customer ? '0.5' : '1'"
  style="width: 100%; color: white; padding: 10px; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; margin-top: 15px; cursor: pointer; transition: all 0.3s ease;">
  {{ !customer ? 'Valida un cliente para poder guardar' : (saving ? 'Guardando en BD...' : (savedFlash ? '¡Guardado con Éxito!' : 'Guardar Simulación')) }}
</button>
<p *ngIf="saveError" style="margin: 8px 0 0; color: #9b1c1c; font-size: 14px;">{{ saveError }}</p>
