<main class="main-container">
  <header class="header">
    <h1>SaaS-O-Matic - Panel Comercial</h1>
  </header>
  
  <section>
    <div class="search-section">
      <app-search (customerFound)="onCustomerFound($event)"></app-search>
    </div>
    
    <div class="grid-container">
      <div class="card">
        <app-customer-card [customer]="clienteActual" [latestSimulation]="ultimaSimulacion"></app-customer-card>
      </div>
      
      <div class="card">
        <app-simulation-form
          [customer]="clienteActual"
          (simulationSaved)="onSimulationSaved($event)">
        </app-simulation-form>
      </div>
    </div>
  </section>
</main>
